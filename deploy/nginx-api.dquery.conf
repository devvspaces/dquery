# /etc/nginx/sites-available/api.dquery.conf  (TLS lines are added by certbot)
server {
    listen 80;
    server_name api.dquery.bytechain.dev;

    client_max_body_size 2m;

    # Bull Board has no auth: never expose it publicly (use an SSH tunnel).
    # (/api/admin/* is the admin API, protected by ADMIN_EMAILS in the app.)
    location ~ ^/(admin|api/admin/queues)(/|$) { return 404; }

    location / {
        proxy_pass http://127.0.0.1:3012;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
